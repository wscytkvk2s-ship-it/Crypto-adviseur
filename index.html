<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Adviseur – Backtest</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0;background:#f3f4f6;color:#161616}
main{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #00000012}
h1{margin:4px 0 2px;font-size:28px}.muted{color:#666;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:13px;color:#666;margin-bottom:5px}select,input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:16px}button{background:#111;color:#fff;border:0;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{padding:14px;background:#f7f7f7;border-radius:12px}.num{font-size:24px;font-weight:800}
.good{font-weight:800}.warn{font-weight:800}.bad{font-weight:800}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}
canvas{width:100%;height:300px;border:1px solid #eee;border-radius:12px}.small{font-size:12px;color:#666;line-height:1.5}
</style>
</head>
<body><main>
<h1>₿ Crypto Adviseur</h1><div class="muted">Historische signalen + backtest. Dit is een experimentele beslissingshulp, geen persoonlijk beleggingsadvies.</div>

<div class="card"><h2>Instellingen</h2><div class="grid">
<div><label>Munt</label><select id="coin"><option value="bitcoin">Bitcoin (BTC)</option><option value="ethereum">Ethereum (ETH)</option><option value="solana">Solana (SOL)</option></select></div>
<div><label>Startkapitaal</label><input id="capital" type="number" value="500" min="1"></div>
<div><label>Backtest</label><select id="years"><option value="1">1 jaar</option><option value="2" selected>2 jaar</option><option value="4">4 jaar</option></select></div>
<div><label>Transactiekosten</label><input id="fee" type="number" value="0.25" min="0" step="0.05"><span class="muted">% per transactie</span></div>
</div><br><button onclick="run()">Analyse + backtest uitvoeren</button></div>

<div id="out"><div class="card">Kies de instellingen en druk op de knop.</div></div>
</main>
<script>
const euro=n=>n.toLocaleString('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const pct=n=>(n*100).toFixed(1)+'%';
function sma(a,n,i){let s=0;for(let j=i-n+1;j<=i;j++)s+=a[j];return s/n}
function rsi(a,i,n=14){if(i<n)return 50;let g=0,l=0;for(let j=i-n+1;j<=i;j++){let d=a[j]-a[j-1];if(d>0)g+=d;else l-=d}if(l===0)return 100;return 100-100/(1+(g/n)/(l/n))}
function scoreAt(p,i){
 if(i<200)return null;
 const cur=p[i],s50=sma(p,50,i),s200=sma(p,200,i),R=rsi(p,i);
 let high=-Infinity;for(let j=Math.max(0,i-365);j<=i;j++)high=Math.max(high,p[j]);
 const dd=(high-cur)/high, mom=cur/p[i-30]-1;
 let trend=(s50>s200?25:8)+(cur>s50?5:0);
 let rs=R<30?25:R<40?20:R<55?14:R<70?7:2;
 let drop=dd>.5?25:dd>.35?22:dd>.2?16:dd>.1?9:3;
 let mm=mom<-.2?20:mom<-.1?16:mom<0?12:mom<.15?8:3;
 return Math.min(100,Math.round(trend+rs+drop+mm));
}
async function fetchData(id,days){
 const symbols={bitcoin:'BTCEUR',ethereum:'ETHEUR',solana:'SOLEUR'};
 const symbol=symbols[id];
 if(!symbol)throw Error('Onbekende munt.');
 const targetDays=Math.max(365,Math.round(days));
 const end=Date.now();
 const start=end-targetDays*86400000;
 const out=[];
 let cursor=start;
 while(cursor<end){
   const u=`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1d&startTime=${cursor}&endTime=${end}&limit=1000`;
   const r=await fetch(u,{cache:'no-store'});
   if(!r.ok)throw Error('Koersdata kon niet worden opgehaald (HTTP '+r.status+').');
   const rows=await r.json();
   if(!Array.isArray(rows)||!rows.length)break;
   for(const row of rows)out.push([row[0],Number(row[4])]);
   const last=rows[rows.length-1][0];
   if(rows.length<1000)break;
   cursor=last+86400000;
 }
 const unique=new Map(out.map(x=>[x[0],x]));
 const prices=[...unique.values()].sort((a,b)=>a[0]-b[0]);
 if(prices.length<250)throw Error('Te weinig historische koersdata ontvangen. Probeer het opnieuw.');
 return prices;
}
function simulate(prices,capital,feePct){
 const p=prices.map(x=>x[1]), f=feePct/100, start=200, step=Math.max(1,Math.floor((p.length-start)/500));
 // Strategy: one-time capital; buy 100% on first signal >=75, otherwise at end if never triggered.
 let cash=capital, units=0, buyIdx=null, signal=0;
 for(let i=start;i<p.length;i++){
   let s=scoreAt(p,i); if(s>=75){signal=s;buyIdx=i;units=(cash*(1-f))/p[i];cash=0;break}
 }
 if(buyIdx===null){buyIdx=p.length-1;units=(cash*(1-f))/p[buyIdx];cash=0}
 const strategy=units*p[p.length-1]*(1-f);
 const bhUnits=capital*(1-f)/p[start], buyhold=bhUnits*p[p.length-1]*(1-f);
 return {strategy,buyhold,buyIdx,signal,ret:(strategy/capital)-1,bhret:(buyhold/capital)-1,p};
}
async function run(){
 const out=document.getElementById('out');out.innerHTML='<div class="card">Historische gegevens ophalen…</div>';
 try{
  const id=document.getElementById('coin').value, cap=+document.getElementById('capital').value||500;
  const years=+document.getElementById('years').value, fee=+document.getElementById('fee').value||0;
  const raw=await fetchData(id,years*365+250), res=simulate(raw,cap,fee);
  const p=res.p, now=p[p.length-1], s=scoreAt(p,p.length-1), R=rsi(p,p.length-1);
  const s50=sma(p,50,p.length-1),s200=sma(p,200,p.length-1);
  const top=Math.max(...p.slice(-365)),dd=(top-now)/top;
  const name=id==='bitcoin'?'Bitcoin':id==='ethereum'?'Ethereum':'Solana';
  const buyDate=new Date(raw[res.buyIdx][0]).toLocaleDateString('nl-NL');
  const winner=res.strategy>=res.buyhold?'Historische strategie':'Kopen & vasthouden';
  out.innerHTML=`<div class="card"><h2>${name} — huidig signaal</h2><div class="kpis">
  <div class="kpi"><div class="muted">Score</div><div class="num">${s}/100</div></div>
  <div class="kpi"><div class="muted">Koers</div><div class="num">${euro(now)}</div></div>
  <div class="kpi"><div class="muted">RSI</div><div class="num">${R.toFixed(1)}</div></div>
  <div class="kpi"><div class="muted">Daling 1 jaar-top</div><div class="num">${pct(dd)}</div></div></div>
  <p class="${s>=75?'good':s>=60?'warn':'bad'}">${s>=75?'🟢 KOOPSIGNAAL':s>=60?'🟡 VOORZICHTIG':'🔴 WACHTEN / NIET KOPEN'}</p>
  <table><tr><td>50-daags gemiddelde</td><td>${euro(s50)}</td></tr><tr><td>200-daags gemiddelde</td><td>${euro(s200)}</td></tr></table></div>
  <div class="card"><h2>Backtest met ${euro(cap)}</h2>
  <div class="kpis"><div class="kpi"><div class="muted">Strategie</div><div class="num">${euro(res.strategy)}</div><div>${pct(res.ret)}</div></div>
  <div class="kpi"><div class="muted">Buy & hold</div><div class="num">${euro(res.buyhold)}</div><div>${pct(res.bhret)}</div></div>
  <div class="kpi"><div class="muted">Winnaar</div><div class="num">${winner}</div></div></div>
  <p>De strategie zou in deze test op <b>${buyDate}</b> zijn ingestapt met een score van ${res.signal}/100. Daarna is de positie aangehouden.</p>
  <p class="small">Let op: dit is bewust een eenvoudige eerste backtest. Er is geen slippage, geen belasting en geen realistische orderuitvoering verwerkt. Historische resultaten zeggen niets zeker over toekomstige rendementen.</p></div>
  <div class="card"><h2>Interpretatie</h2><p>De app gebruikt historische prijsdata voor trend, RSI, momentum en afstand tot de 1-jaarstop. De app gebruikt openbare dagelijkse EUR-koersdata van Binance voor de geselecteerde munt. De backtest gebruikt uitsluitend historische slotkoersen.</p></div>`;
 }catch(e){out.innerHTML='<div class="card"><b>Fout:</b> '+e.message+'<p class="small">Probeer opnieuw. De app heeft internettoegang nodig om historische koersdata op te halen.</p></div>'}
}
</script></body></html>
